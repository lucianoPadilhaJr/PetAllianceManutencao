<script>
    const maxFotos = 10;
    const container = document.getElementById('fotos-container');
    const btnAdd = document.getElementById('btn-add-foto');
    const counter = document.getElementById('foto-counter');
    const wrapper = document.getElementById('fotos-scroll-wrapper');

    function updateCounter() {
        const total = container.querySelectorAll('.foto-input-group').length;
        counter.textContent = total + ' de ' + maxFotos + ' fotos';
        btnAdd.style.display = total >= maxFotos ? 'none' : 'inline-block';
    }

    container.addEventListener('change', function(e) {
        if (e.target.classList.contains('input-foto')) {
            const group = e.target.closest('.foto-input-group');
            const preview = group.querySelector('.preview-foto');
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    preview.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    });

    btnAdd.addEventListener('click', function() {
        const total = container.querySelectorAll('.foto-input-group').length;
        if (total >= maxFotos) return;

        const group = document.createElement('div');
        group.className = 'foto-input-group';
        group.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;min-width:130px;';
        group.innerHTML =
            '<img src="/uploads/usuario/placeholder.webp" class="preview-foto" style="width:120px;height:120px;object-fit:cover;border-radius:0.5rem;border:1px solid var(--border);" alt="Preview">' +
            '<input type="file" name="fotos[]" class="input-foto" accept="image/jpeg,image/png,image/webp" style="font-size:0.7rem;width:100%;margin-top:0.25rem;">' +
            '<button type="button" class="btn-remove-foto" style="margin-top:0.25rem;">Remover</button>';
        container.appendChild(group);
        wrapper.scrollLeft = wrapper.scrollWidth;
        updateCounter();
    });

    container.addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-remove-foto')) {
            const group = e.target.closest('.foto-input-group');
            if (container.querySelectorAll('.foto-input-group').length <= 1) return;
            group.remove();
            updateCounter();
        }
    });

    updateCounter();
</script>
