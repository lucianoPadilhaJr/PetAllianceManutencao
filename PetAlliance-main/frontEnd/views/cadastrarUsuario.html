<script>
  const inputUser = document.getElementById('imagemPerfil');
  const previewUser = document.getElementById('preview-usuario');
  inputUser.addEventListener('change', function() {
    const file = this.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) { previewUser.src = e.target.result; };
      reader.readAsDataURL(file);
    }
  });
</script>
