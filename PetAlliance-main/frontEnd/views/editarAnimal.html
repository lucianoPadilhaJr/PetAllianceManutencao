<script>
    const maxFotos = 10;
    const container = document.getElementById('fotos-container');
    const btnAdd = document.getElementById('btn-add-foto');
    const counter = document.getElementById('foto-counter');
    const wrapper = document.getElementById('fotos-scroll-wrapper');

    function updateCounter() {
        const total = container.querySelectorAll('.foto-input-group').length;
        counter.textContent = total + ' de ' + maxFotos + ' fotos';
        btnAdd.style.display = total >= maxFotos ? 'none' : 'inline-block';
    }

    container.addEventListener('change', function(e) {
        if (e.target.classList.contains('input-foto')) {
            const group = e.target.closest('.foto-input-group');
            const preview = group.querySelector('.preview-foto');
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    preview.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    });

    btnAdd.addEventListener('click', function() {
        const total = container.querySelectorAll('.foto-input-group').length;
        if (total >= maxFotos) return;

        const group = document.createElement('div');
        group.className = 'foto-input-group';
        group.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;min-width:130px;';
        group.innerHTML =
            '<img src="/uploads/usuario/placeholder.webp" class="preview-foto" style="width:120px;height:120px;object-fit:cover;border-radius:0.5rem;border:1px solid var(--border);" alt="Preview">' +
            '<input type="file" name="novas_fotos[]" class="input-foto" accept="image/jpeg,image/png,image/webp" style="font-size:0.7rem;width:100%;margin-top:0.25rem;">' +
            '<button type="button" class="btn-remove-foto" style="margin-top:0.25rem;">Remover</button>';
        container.appendChild(group);
        wrapper.scrollLeft = wrapper.scrollWidth;
        updateCounter();
    });

    container.addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-remove-foto')) {
            const group = e.target.closest('.foto-input-group');
            if (container.querySelectorAll('.foto-input-group').length <= 1) return;
            group.remove();
            updateCounter();
        }
    });

    updateCounter();

    const fotosAtuais = document.getElementById('fotos-atuais');
    if (fotosAtuais) {
        fotosAtuais.addEventListener('click', async function(e) {
            const btn = e.target.closest('.btn-remove-foto-existente');
            if (!btn) return;
            if (!confirm('Remover esta foto?')) return;

            const fotoPath = btn.dataset.fotoPath;
            const div = btn.closest('[data-foto-path]');

            try {
                const resp = await fetch('/backEnd/home.php?route=remover_foto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pet_id: <?= $animal->getId() ?>,
                        foto_path: fotoPath
                    }),
                    credentials: 'same-origin'
                });
                const data = await resp.json();
                if (data.success) {
                    div.remove();
                } else {
                    alert('Erro: ' + (data.error || 'Erro desconhecido'));
                }
            } catch (err) {
                alert('Erro de conexÃ£o.');
            }
        });
    }

    const selectVacinado = document.getElementById('vacinado');
    const campoVacinacao = document.getElementById('campoVacinacao');
    const selectCertificado = document.getElementById('certificado');
    const campoCertificado = document.getElementById('campoCertificado');

    function toggleVacinacao() {
        campoVacinacao.style.display = selectVacinado.value === '1' ? 'block' : 'none';
        const input = campoVacinacao.querySelector('input');
        if (selectVacinado.value !== '1') input.removeAttribute('required');
        else input.setAttribute('required', '');
    }

    function toggleCertificado() {
        campoCertificado.style.display = selectCertificado.value === '1' ? 'block' : 'none';
        const input = campoCertificado.querySelector('input');
        if (selectCertificado.value !== '1') input.removeAttribute('required');
        else input.setAttribute('required', '');
    }

    selectVacinado.addEventListener('change', toggleVacinacao);
    selectCertificado.addEventListener('change', toggleCertificado);

    if (selectVacinado.value === '1') toggleVacinacao();
    if (selectCertificado.value === '1') toggleCertificado();
</script>
